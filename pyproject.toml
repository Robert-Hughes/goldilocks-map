[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldilocks-map"
version = "0.1.0"
description = "Build a single-file location suitability map from preprocessed geospatial data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "h5py>=3.12",
  "pyproj>=3.7",
  "fiona>=1.10",
  "shapely>=2.1",
]

[tool.setuptools]
py-modules = []
