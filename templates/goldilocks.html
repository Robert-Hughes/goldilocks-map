<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Goldilocks Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17212b; }
    body { background: #f7f8f8; }
    #map { height: 100%; width: 100%; }
    .map-panel { width: min(320px, calc(100vw - 80px)); max-height: calc(100vh - 84px); overflow: hidden; background: rgba(255,255,255,0.96); box-shadow: 0 1px 5px rgba(0,0,0,0.25); border-radius: 5px; font-size: 0.82rem; line-height: 1.35; }
    .map-panel-header { display: flex; align-items: center; gap: 0.55rem; padding: 0.55rem 0.6rem; }
    .map-panel-heading { flex: 1; min-width: 0; }
    .map-panel-title { margin: 0; font-size: 1.08rem; line-height: 1.15; }
    .map-panel-subtitle { margin-top: 0.15rem; color: #4d5b66; font-size: 0.78rem; }
    .map-panel-toggle { flex: 0 0 auto; width: 2rem; height: 2rem; padding: 0; border: 1px solid #aeb8c0; border-radius: 4px; background: #fff; color: #17212b; font-size: 1.15rem; line-height: 1; cursor: pointer; }
    .map-panel-body { max-height: calc(100vh - 145px); overflow: auto; padding: 0 0.65rem 0.65rem; border-top: 1px solid #d8dee3; }
    .map-panel.collapsed { width: auto; max-width: min(250px, calc(100vw - 80px)); }
    .map-panel.collapsed .map-panel-body, .map-panel.collapsed .map-panel-subtitle { display: none; }
    .panel-section { padding-top: 0.65rem; }
    .panel-section + .panel-section { margin-top: 0.6rem; border-top: 1px solid #e1e5e8; }
    .panel-section-title { display: block; margin: 0 0 0.35rem; font-weight: 700; }
    .panel-option { display: flex; align-items: center; gap: 0.45rem; cursor: pointer; user-select: none; }
    .panel-option + .panel-option { margin-top: 0.35rem; }
    .panel-option input { margin: 0; }
    .metric-list { display: grid; gap: 0.55rem; }
    .metric-category { min-inline-size: 0; margin: 0; padding: 0; border: 0; }
    .metric-category + .metric-category { padding-top: 0.5rem; border-top: 1px solid #e1e5e8; }
    .metric-category-title { margin: 0 0 0.18rem; padding: 0; font-weight: 700; color: #344650; font-size: 0.8rem; }
    .metric-option { display: flex; align-items: flex-start; gap: 0.45rem; padding: 0.18rem 0; cursor: pointer; }
    .metric-option input { margin: 0.18rem 0 0; flex: 0 0 auto; }
    .preview-warning { margin-top: 0.65rem; padding: 0.45rem 0.5rem; border: 1px solid #d4a72c; border-radius: 4px; background: #fff8db; color: #5e4b00; }
    .file-basemap-warning { max-width: min(360px, calc(100vw - 90px)); padding: 0.45rem 0.55rem; border: 1px solid #d4a72c; border-radius: 4px; background: rgba(255,248,219,0.96); color: #5e4b00; box-shadow: 0 1px 4px rgba(0,0,0,0.18); font-size: 0.78rem; }
    .opacity-heading { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .opacity-heading .panel-section-title { margin: 0; }
    .opacity-output { font-weight: 600; font-variant-numeric: tabular-nums; }
    .opacity-input { width: 100%; margin: 0.35rem 0 0; padding: 0; }
    .range-heading { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .range-heading .panel-section-title { margin: 0; }
    .range-reset { padding: 0.18rem 0.45rem; border: 1px solid #aeb8c0; border-radius: 4px; background: #fff; color: #17212b; font: inherit; cursor: pointer; }
    .range-reset:disabled { opacity: 0.45; cursor: default; }
    .display-range-control { margin-top: 0.4rem; }
    .range-current-values { display: flex; justify-content: space-between; gap: 0.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .dual-range { position: relative; height: 28px; margin: 0.12rem 0 0.3rem; }
    .range-track, .range-active { position: absolute; top: 11px; height: 6px; border-radius: 999px; pointer-events: none; }
    .range-track { left: 0; right: 0; background: #d9dee2; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
    .range-active { z-index: 1; }
    .range-input { position: absolute; z-index: 2; left: 0; top: 0; width: 100%; height: 28px; margin: 0; padding: 0; appearance: none; -webkit-appearance: none; background: transparent; pointer-events: none; }
    .range-input::-webkit-slider-runnable-track { height: 6px; border: 0; background: transparent; }
    .range-input::-moz-range-track { height: 6px; border: 0; background: transparent; }
    .range-input::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -5px; border: 1px solid #53626d; border-radius: 50%; appearance: none; -webkit-appearance: none; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); cursor: ew-resize; pointer-events: auto; }
    .range-input::-moz-range-thumb { width: 16px; height: 16px; border: 1px solid #53626d; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.25); cursor: ew-resize; pointer-events: auto; }
    .range-input:focus-visible::-webkit-slider-thumb { outline: 2px solid #17212b; outline-offset: 2px; }
    .range-input:focus-visible::-moz-range-thumb { outline: 2px solid #17212b; outline-offset: 2px; }
    .range-legend { display: grid; gap: 0.15rem; }
    .range-legend-item { min-width: 0; text-align: center; color: #44515b; font-size: 0.7rem; font-variant-numeric: tabular-nums; }
    .range-legend-swatch { display: block; width: min(34px, 100%); height: 10px; margin: 0 auto 0.12rem; border: 1px solid rgba(0,0,0,0.3); box-sizing: border-box; }
    .range-unit { margin-top: 0.12rem; text-align: center; color: #697781; font-size: 0.7rem; }
    .leaflet-popup-content { line-height: 1.45; }
    .leaflet-popup-content dl { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.55rem; margin: 0; }
    .leaflet-popup-content dt { font-weight: 600; }
    .leaflet-popup-content dd { margin: 0; }
    .provenance-details { margin-top: 0.45rem; }
    .provenance-details summary, .legal-notices summary { cursor: pointer; font-weight: 600; }
    .provenance-details div { margin-top: 0.35rem; }
    .legal-notices pre { margin: 0.45rem 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.68rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .location-panel { width: min(360px, calc(50vw - 30px)); max-height: calc(100vh - 84px); overflow: hidden; background: rgba(255,255,255,0.97); box-shadow: 0 1px 5px rgba(0,0,0,0.25); border-radius: 5px; font-size: 0.82rem; line-height: 1.35; }
    .location-panel-header { display: flex; align-items: center; gap: 0.55rem; padding: 0.55rem 0.6rem; }
    .location-panel-heading { display: flex; align-items: baseline; gap: 0.35rem; flex: 1; min-width: 0; }
    .location-panel-title { font-size: 1rem; }
    .location-panel-count { color: #596771; font-variant-numeric: tabular-nums; }
    .location-panel-toggle { flex: 0 0 auto; width: 2rem; height: 2rem; padding: 0; border: 1px solid #aeb8c0; border-radius: 4px; background: #fff; color: #17212b; font-size: 1.15rem; line-height: 1; cursor: pointer; }
    .location-panel-body { max-height: calc(100vh - 145px); overflow: auto; padding: 0.65rem; border-top: 1px solid #d8dee3; }
    .location-panel.collapsed { width: auto; max-width: min(220px, calc(100vw - 80px)); }
    .location-panel.collapsed .location-panel-body { display: none; }
    .location-panel-actions, .location-transfer-actions, .location-edit-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .location-button, .location-context-action { padding: 0.28rem 0.52rem; border: 1px solid #aeb8c0; border-radius: 4px; background: #fff; color: #17212b; font: inherit; cursor: pointer; }
    .location-button:hover, .location-context-action:hover { background: #f1f4f6; }
    .location-button:disabled { opacity: 0.42; cursor: default; }
    .location-button-primary { border-color: #657783; font-weight: 600; }
    .location-button-danger { border-color: #b36a6a; }
    .location-button-compact { padding: 0.18rem 0.38rem; }
    .location-order-button { min-width: 1.8rem; font-weight: 700; }
    .location-status { margin-top: 0.55rem; padding: 0.4rem 0.48rem; border-radius: 4px; background: #eef4f7; color: #354852; }
    .location-status-error { border: 1px solid #c77a71; background: #fff1ef; color: #6a2922; }
    .location-empty { margin-top: 0.65rem; color: #596771; }
    .location-list { display: grid; gap: 0.5rem; margin-top: 0.65rem; }
    .location-item { padding: 0.48rem; border: 1px solid #d8dee3; border-radius: 5px; background: #fff; }
    .location-item-new { border-style: dashed; }
    .location-item-summary { display: flex; align-items: flex-start; gap: 0.45rem; }
    .location-item-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .location-item-controls { display: flex; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; gap: 0.25rem; }
    .location-edit-form { display: grid; gap: 0.5rem; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #e1e5e8; }
    .location-edit-form label { display: grid; gap: 0.18rem; font-weight: 600; }
    .location-edit-form input, .location-edit-form textarea, .location-json { box-sizing: border-box; width: 100%; border: 1px solid #aeb8c0; border-radius: 4px; background: #fff; color: #17212b; font: inherit; }
    .location-edit-form input, .location-edit-form textarea { padding: 0.34rem 0.4rem; font-weight: 400; }
    .location-edit-form textarea, .location-json { resize: vertical; }
    .location-coordinate-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.45rem; }
    .location-form-error { padding: 0.35rem 0.42rem; border-radius: 4px; background: #fff1ef; color: #6a2922; }
    .location-transfer { margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid #e1e5e8; }
    .location-transfer summary { cursor: pointer; font-weight: 600; }
    .location-transfer-help { margin: 0.4rem 0; color: #596771; }
    .location-json { min-height: 7rem; padding: 0.4rem; font: 0.72rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .location-transfer-actions { margin-top: 0.4rem; }
    .goldilocks-location-marker-icon { overflow: visible !important; border: 0 !important; background: transparent !important; }
    .location-marker-label { position: absolute; left: 0; top: -8px; display: block; width: max-content; max-width: min(240px, 70vw); transform: translate(-50%, -100%); padding: 0.28rem 0.45rem; border: 1px solid #56656f; border-radius: 4px; background: rgba(255,255,255,0.96); box-shadow: 0 1px 4px rgba(0,0,0,0.28); color: #17212b; font: 600 0.78rem/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; white-space: normal; overflow-wrap: anywhere; }
    .location-marker-label::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -5px; border: 5px solid transparent; border-top-color: #56656f; }
    .location-context-popup .leaflet-popup-content { margin: 6px; }
    .location-context-menu { display: flex; }
    .location-context-action { white-space: nowrap; }
    .leaflet-top.goldilocks-narrow-panel-active { z-index: 1100; }
    @media (max-width: 600px) {
      .map-panel { width: min(290px, calc(100vw - 72px)); max-height: calc(100vh - 80px); }
      .map-panel-body { max-height: calc(100vh - 140px); }
      .location-panel { width: min(300px, calc(100vw - 72px)); max-height: calc(100vh - 80px); }
      .location-panel-body { max-height: calc(100vh - 140px); }
      .map-panel.collapsed .map-panel-heading, .location-panel.collapsed .location-panel-heading { display: none; }
      .map-panel.collapsed .map-panel-header, .location-panel.collapsed .location-panel-header { gap: 0; padding: 0; }
      .map-panel.collapsed .map-panel-toggle, .location-panel.collapsed .location-panel-toggle { width: 2.25rem; height: 2.25rem; border: 0; border-radius: 5px; }
      .location-coordinate-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main id="map" aria-label="Interactive map"></main>

  <template id="goldilocks-third-party-notices"><pre>__THIRD_PARTY_NOTICES__</pre></template>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script id="goldilocks-data" type="application/json">__GOLDILOCKS_DATA__</script>
  <script>__GOLDILOCKS_APP_JS__</script>
</body>
</html>
